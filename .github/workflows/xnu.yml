name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (SWEET=732G, POLARIS=SDM845/Mi Mix 2S, PERSEUS=SDM845/Mi Mix 3)
        default: PERSEUS
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'PERSEUS' }}

jobs:
  build:
    # macos-14 (the only image that still shipped Xcode 15.x) was retired on
    # 2026-11-02. This now runs on macos-15-intel with the oldest Xcode that
    # image still carries (16.0). Xcode 16's iig emits IORPC.kernelContent,
    # which xnu-8796 does not define, so that has to be patched in.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=/Applications/Xcode_16.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Toolchain probe
        run: |
          echo "=== xcodebuild ==="; xcodebuild -version
          echo "=== sdk ==="; xcrun --sdk macosx --show-sdk-version
          SDK=$(xcrun --sdk macosx --show-sdk-path); echo "SDK=$SDK"
          echo "=== iig ==="; xcrun --find iig || true
          echo "=== kernelContent in SDK IORPC.h ==="
          H="$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/IOKit/IORPC.h"
          if [ -f "$H" ]; then grep -n "kernelContent" "$H" || echo "absent"; else echo "IORPC.h not in SDK"; fi
          echo "=== KDKs present ==="; ls -d /Library/Developer/KDKs/* 2>/dev/null || echo none
          # annotations are the only log surface readable without signing in
          echo "::notice::sdk=$(xcrun --sdk macosx --show-sdk-version) iig=$(xcrun --find iig 2>/dev/null)"
          if [ -f "$H" ] && grep -q "kernelContent" "$H"; then
            echo "::notice::SDK IORPC.h DOES define kernelContent"
          else
            echo "::notice::SDK IORPC.h has no kernelContent"
          fi

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../build.log

      - name: Surface build errors
        if: always()
        run: |
          L=build.log
          if [ ! -f "$L" ]; then echo "::error::build.log missing"; exit 0; fi
          echo "build.log: $(wc -l < "$L") lines, $(grep -c 'error:' "$L" 2>/dev/null || echo 0) error lines"
          grep -nE "error:|Error [0-9]+|\*\*\* " "$L" | head -14 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-900)"
          done
          tail -8 "$L" | while IFS= read -r line; do
            echo "::error::tail| $(printf '%s' "$line" | cut -c1-900)"
          done

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: |
            buildtree.tgz
            build.log
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
