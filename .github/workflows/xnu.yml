name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (SWEET=732G, POLARIS=SDM845/Mi Mix 2S, PERSEUS=SDM845/Mi Mix 3)
        default: PERSEUS
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'PERSEUS' }}

jobs:
  build:
    # macos-14 (the only image that still shipped Xcode 15.x) was retired on
    # 2026-11-02. This now runs on macos-15-intel with the oldest Xcode that
    # image still carries (16.0). Xcode 16's iig emits IORPC.kernelContent,
    # which xnu-8796 does not define, so that has to be patched in.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          # build.sh silently downgrades an unapplicable patch to a ::warning::
          # that the log surface cannot see, which is how the PERSEUS machine
          # config went missing while the build only complained later on. Turn
          # every skip into an annotation so it shows up in the run summary --
          # but as a warning: annotations are capped per run and 17 hard errors
          # pushed the actual compile failures out of the visible list.
          sed -i '' 's|^\( *\)warning "Skipping patch.*APPLY_CHECK}"|\1echo "::warning::SKIPPED PATCH $(basename ${PATCH}) :: ${APPLY_CHECK}"|' dxb/build.sh
          grep -n 'SKIPPED PATCH' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=/Applications/Xcode_16.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Toolchain probe
        run: |
          echo "=== xcodebuild ==="; xcodebuild -version
          echo "=== sdk ==="; xcrun --sdk macosx --show-sdk-version
          SDK=$(xcrun --sdk macosx --show-sdk-path); echo "SDK=$SDK"
          echo "=== iig ==="; xcrun --find iig || true
          echo "=== kernelContent in SDK IORPC.h ==="
          H="$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/IOKit/IORPC.h"
          if [ -f "$H" ]; then grep -n "kernelContent" "$H" || echo "absent"; else echo "IORPC.h not in SDK"; fi
          echo "=== KDKs present ==="; ls -d /Library/Developer/KDKs/* 2>/dev/null || echo none
          # annotations are the only log surface readable without signing in
          echo "::notice::sdk=$(xcrun --sdk macosx --show-sdk-version) iig=$(xcrun --find iig 2>/dev/null)"
          if [ -f "$H" ] && grep -q "kernelContent" "$H"; then
            echo "::notice::SDK IORPC.h DOES define kernelContent"
          else
            echo "::notice::SDK IORPC.h has no kernelContent"
          fi

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../build.log

      - name: Verify perseus config landed
        if: always()
        run: |
          # The build only fails late (MakeInc.kernel) when a patch was skipped,
          # so assert up front that the machine config really made it into the tree.
          fail=0
          if [ ! -d dxb/xnu ]; then
            echo "::warning::dxb/xnu not present, patch stage never ran"
            exit 0
          fi
          if grep -q 'SUPPORTED_ARM64_MACHINE_CONFIGS = .*PERSEUS' dxb/xnu/makedefs/MakeInc.def; then
            echo "::notice::PERSEUS listed in SUPPORTED_ARM64_MACHINE_CONFIGS"
          else
            echo "::error::PERSEUS missing from SUPPORTED_ARM64_MACHINE_CONFIGS (0101 did not apply)"
            fail=1
          fi
          grep -n 'MACHINE_FLAGS_ARM64_PERSEUS' dxb/xnu/makedefs/MakeInc.def || { echo "::error::MACHINE_FLAGS_ARM64_PERSEUS missing"; fail=1; }
          for f in dxb/xnu/pexpert/pexpert/arm64/PERSEUS.h dxb/xnu/config/MASTER.arm64.perseus dxb/xnu/pexpert/pexpert/arm64/SWEET.h; do
            [ -f "$f" ] && echo "::notice::present $f" || { echo "::error::missing $f"; fail=1; }
          done
          grep -n 'PERSEUS.h' dxb/xnu/pexpert/pexpert/arm64/Makefile || { echo "::error::PERSEUS.h not in pexpert Makefile"; fail=1; }
          # PERSEUS is compiled as a SWEET variant, so the *.sh staging scripts
          # and the built-in provider make filters must treat it like POLARIS.
          # Missing providers are what the wq/kesl compile then reports as
          # 'sweet_bearssl/inc/bearssl_hash.h file not found' and friends.
          for f in dxb/xnu/bsd/pthread/sweet_libpthread/kern/kern_init.c \
                   dxb/xnu/bsd/pthread/sweet_libpthread/kern/kern_synch.c \
                   dxb/xnu/libkern/crypto/sweet_bearssl/inc/bearssl_hash.h \
                   dxb/xnu/bsd/sweet_hfs/core/hfs.h \
                   dxb/xnu/bsd/sweet_hfs/core/hfs_catalog.c; do
            [ -f "$f" ] && echo "::notice::staged $f" || { echo "::error::provider not staged: $f"; fail=1; }
          done
          for f in dxb/xnu/bsd/conf/Makefile.template dxb/xnu/libkern/conf/Makefile.template; do
            grep -q 'filter SWEET POLARIS PERSEUS' "$f" || { echo "::error::PERSEUS missing from builtin provider filter: $f"; fail=1; }
          done
          exit $fail

      - name: Surface build errors
        if: always()
        run: |
          # A green build must not leave a red annotation behind: only emit
          # ::error:: when the log really contains compiler or make failures.
          python3 - <<'PY'
          import re, os
          if not os.path.exists('build.log'):
              print('::error::build.log missing')
              raise SystemExit(0)
          clean = [re.sub(r'\x1b\[[0-9;]*m', '', re.sub(r'^\S*Z ', '', l))
                   for l in open('build.log', encoding='utf-8', errors='replace').read().splitlines()]
          errs = sorted({m for l in clean
                         for m in re.findall(r'[^ \t]+?:\d+:\d+:\s*(?:fatal )?error: .*', l)})
          mks = [l.strip() for l in clean if '*** ' in l][:6]
          print(f'build.log: {len(clean)} lines, {len(errs)} compiler errors, {len(mks)} make failures')
          if not errs and not mks:
              print('::notice::build.log clean: no compiler errors, no make failures')
              raise SystemExit(0)
          body = ' + '.join([*errs[:24], '== make failures ==', *mks,
                             '== tail ==', *[l.strip() for l in clean[-6:] if l.strip()]])
          for i in range(0, len(body), 3500):
              print('::error::' + body[i:i + 3500])
          PY

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: |
            buildtree.tgz
            build.log
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
